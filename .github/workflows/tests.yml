name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned backend dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Generate synthetic example data
        run: python tools/make_examples.py --output examples
      # The deselected tests call CAST 1.0.4 through the private Windows R runtime (Install.cmd -WithR);
      # they run in the windows-install workflow. The area of applicability tests compare with the
      # committed CAST fixtures and run here.
      # The deep-learning and package tests need requirements-d-lock.txt and a built add-in package.
      - name: Run backend and installer tests
        run: >
          python -m pytest tests installer/test_sps_install.py -q -p no:cacheprovider
          --ignore=tests/test_package.py --ignore=tests/test_models_d.py --ignore=tests/test_tabpfn_d.py
          --ignore=tests/test_model_integration_d.py --ignore=tests/test_publication_models_d.py
          --deselect tests/test_engine_c.py::test_knndm_mapping_domain_and_nested_training
          --deselect tests/test_knndm_c.py::test_real_cast_bridge_matches_reference_folds_and_three_distance_distributions
          --deselect tests/test_knndm_c.py::test_real_cast_reads_unicode_work_paths_with_c_parent_locale
          --deselect tests/test_knndm_c.py::test_folds_preserve_reference_distances_and_reject_group_splitting

  mcp-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pywin32 is Windows-only; the remaining pins are installed without hashes on Linux.
      - name: Install pinned MCP dependencies
        run: |
          grep -v '^#' ../requirements-mcp-lock.txt | sed 's/ --hash=.*//' | grep -iv '^pywin32' | grep -v '^$' > /tmp/mcp-req.txt
          python -m pip install -r /tmp/mcp-req.txt
      # The deselected tests use Windows named pipes or Windows file semantics.
      - name: Run MCP server tests
        run: >
          python -m pytest tests -q -p no:cacheprovider
          --deselect tests/test_mcp.py::test_export_report_exact_native_extension_and_no_overwrite
          --deselect tests/test_mcp.py::test_real_windows_named_pipe_transport_with_synthetic_peer
