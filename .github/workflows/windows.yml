name: windows-install

# Runs the real installer on a clean Windows machine. GitHub runners have no ArcGIS Desktop, so the
# add-in is compiled against the ArcObjects stand-ins in native/ci and installed into a staging
# Documents folder. Everything else is the same path a user takes with Install.cmd.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      # Users download a ZIP whose files keep the line endings stored in the repository.
      - name: Keep stored line endings on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install with Install.cmd's script (staging, ArcObjects stand-ins, MCP server, R runtime)
        run: |
          .\installer\bootstrap.ps1 -Action Install -InstallRoot "$env:RUNNER_TEMP\sps" -Staging "$env:RUNNER_TEMP\stage" -EsriStubs -WithMcp -WithR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show the end of the installer log
        if: failure()
        run: |
          $log = Get-ChildItem "$env:RUNNER_TEMP\sps\logs\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $log) { exit 0 }
          $text = Get-Content -LiteralPath $log.FullName -Raw
          if ($text.Length -gt 36000) { $text = $text.Substring($text.Length - 36000) }
          $count = [Math]::Ceiling($text.Length / 4000)
          for ($i = 0; $i -lt $count; $i++) {
            $part = $text.Substring($i * 4000, [Math]::Min(4000, $text.Length - $i * 4000))
            $part = $part.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output ('::error title=installer log {0}/{1}::{2}' -f ($i + 1), $count, $part)
          }

      - name: Verify the installation
        run: |
          .\installer\bootstrap.ps1 -Action Verify -InstallRoot "$env:RUNNER_TEMP\sps" -Staging "$env:RUNNER_TEMP\stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Each test command runs through annotate_failure.py, which repeats the end of a failing
      # command's output as annotations, because job logs are not readable from every environment.
      - name: Backend tests with the installed runtime
        # The R/CAST tests use the R runtime installed with -WithR. TabPFN tests need the licensed
        # weights; the model comparison test is deselected by name because it includes TabPFN.
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\sps\current.json" -Raw | ConvertFrom-Json).application_root
          $py = "$app\runtime-d\Scripts\python.exe"
          & $py -I tools\make_examples.py --output examples
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -I -X utf8 .github\scripts\annotate_failure.py backend-tests `
            $py -m pytest tests installer\test_sps_install.py -q -rfE --tb=short -p no:cacheprovider --ignore=tests\test_package.py -k "not tabpfn" `
            --deselect tests/test_models_d.py::test_actual_models_and_baselines_share_identical_heldout_folds
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native contract tests (C# panel, job client, process ownership)
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\sps\current.json" -Raw | ConvertFrom-Json).application_root
          $cache = "$env:RUNNER_TEMP\sps\cache"
          $csc = (Get-ChildItem "$cache\csharp-compiler-*\csc.exe" | Select-Object -First 1).FullName
          $ref = (Get-ChildItem "$cache\net48-reference-assemblies-*" -Directory | Select-Object -First 1).FullName
          $out = "$env:RUNNER_TEMP\native"
          $py = "$app\runtime-d\Scripts\python.exe"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $common = @('-nologo', '-noconfig', '-nostdlib+', '-target:exe', '-platform:x86', '-langversion:7.3')
          foreach ($name in 'mscorlib', 'System', 'System.Core', 'System.Web.Extensions', 'System.Windows.Forms', 'System.Drawing', 'System.Data', 'Microsoft.VisualBasic') {
            $common += "-reference:$ref\$name.dll"
          }
          $s = 'native\SpatialPredictionStudio'
          $report = @('-I', '-X', 'utf8', '.github\scripts\annotate_failure.py')
          & $py @report compile-NativeContracts $csc @common "-out:$out\NativeContracts.exe" native\tests\NativeContracts.cs "$s\JobClient.cs" "$s\ArtifactIntegrity.cs" native\tests\RegistryContracts.cs native\tests\ModelExportContracts.cs "$s\MethodRegistry.cs" "$s\RegistryEditor.cs" "$s\WorkflowEditors.cs" "$s\ArtifactViewer.cs" native\tests\ArtifactViewerContracts.cs native\tests\McpBridgeContracts.cs "$s\McpPipeBridge.cs" "$s\OwnedProcessJob.cs" "$s\ModelExport.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py @report compile-OwnedProcessContracts $csc @common "-out:$out\OwnedProcessContracts.exe" native\tests\OwnedProcessContracts.cs "$s\JobClient.cs" "$s\OwnedProcessJob.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py @report compile-PanelContracts $csc @common "-out:$out\PanelContracts.exe" native\tests\PanelContracts.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$app\build\SpatialPredictionStudio.dll" $out
          Copy-Item "$app\build\esri-stubs\*.dll" $out
          $evidence = "$out\evidence"
          & $py @report NativeContracts "$out\NativeContracts.exe" $py native\tests\worker_stub.py $evidence backend\sps\registry.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py @report PanelContracts "$out\PanelContracts.exe" "$out\SpatialPredictionStudio.dll" "$evidence\accepted_methods.fixture.json" "$evidence\panel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py @report OwnedProcessContracts "$out\OwnedProcessContracts.exe" $py native\tests\owned_worker_stub.py "$evidence\owned-process"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: MCP server tests on Windows (named pipes included)
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\sps\current.json" -Raw | ConvertFrom-Json).application_root
          $py = "$app\runtime-mcp\Scripts\python.exe"
          Push-Location mcp-server
          & $py -I -X utf8 ..\.github\scripts\annotate_failure.py mcp-tests $py -m pytest tests -q -rfE --tb=short -p no:cacheprovider
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

      - name: Uninstall and check that nothing owned is left
        run: |
          $app = (Get-Content "$env:RUNNER_TEMP\sps\current.json" -Raw | ConvertFrom-Json).application_root
          .\installer\bootstrap.ps1 -Action Uninstall -InstallRoot "$env:RUNNER_TEMP\sps" -Staging "$env:RUNNER_TEMP\stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addin = Get-ChildItem -Recurse "$env:RUNNER_TEMP\stage\Documents" -Filter *.esriAddIn -ErrorAction SilentlyContinue
          if ($addin) { throw 'The add-in was not removed.' }
          if (Test-Path -LiteralPath ('\\?\' + $app)) { throw 'The application folder was not removed.' }

      - name: Keep the installer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: ${{ runner.temp }}\sps\logs
          if-no-files-found: ignore
